<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midday Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body data-time="midday">
  <main class="wrap">
    <div id="header"></div>

    <section class="page-head">
      <span class="kicker"><i class="ph ph-sun"></i> Midday</span>
      <h1>Pick an adventure</h1>
      <p class="lead">Each of us picks one in secret.</p>
      <p class="tip">Rainy or cold? Pick something indoors.</p>
    </section>

    <div id="choice"></div>

    <section class="section" id="plan" hidden></section>
  </main>

  <script src="assets/js/common.js?v=3"></script>
  <script src="assets/js/sync.js?v=3"></script>
  <script src="assets/js/choice.js?v=3"></script>
  <script>
    const OPTIONS = [
      { id: 'culture', icon: 'ph-bank', img: 'assets/img/museum.jpg', title: 'Cultural visit', short: 'A museum or gallery in each of our cities.' },
      { id: 'dance', icon: 'ph-music-notes', img: 'assets/img/dance.jpg', title: 'Dance challenge', short: 'Learn the same dance and record it.' },
      { id: 'swim', icon: 'ph-swimming-pool', img: 'assets/img/pool.jpg', title: 'Swimming', short: 'An indoor pool, each on our own.', tip: 'Phone stays out of the water.' },
      { id: 'spot', icon: 'ph-tree', img: 'assets/img/park.jpg', title: 'Favorite outdoor spot', short: 'Our favorite places, with a snack.' },
      { id: 'sport', icon: 'ph-person-simple-run', img: 'assets/img/archery.jpg', title: 'Outdoor sport', short: 'Yoga, a walk or archery.', tip: 'Archery only at a supervised range.' },
    ];

    const plan = document.getElementById('plan');

    function showPlan(opt) {
      if (!opt) { plan.hidden = true; return; }
      plan.hidden = false;
      plan.innerHTML = `
        <div class="panel plan ${App.reducedMotion() ? '' : 'reveal'}">
          <h3><i class="ph ${opt.icon}"></i> ${App.esc(opt.title)}</h3>
          <p>${App.esc(opt.short)}</p>
          ${opt.tip ? `<p class="tip">${App.esc(opt.tip)}</p>` : ''}
        </div>
        <div class="panel plan">
          <h3><i class="ph ph-camera"></i> Afterwards: our photo</h3>
          <img src="assets/img/photo-together.jpg" alt="Two photos taken in different rooms, joined down the middle">
          <p>Each of us at the edge of our own photo, then we join them.</p>
        </div>
        <div class="panel plan">
          <h3><i class="ph ph-shopping-cart"></i> On the way home</h3>
          <p>Dinner ingredients, plus canvases and paints.</p>
          <div class="actions"><a class="btn btn-ghost" href="night.html">On to the night <i class="ph ph-arrow-right"></i></a></div>
        </div>`;
    }

    App.mountHeader(document.getElementById('header'));
    App.requireMe(() => {
      mountChoice(document.getElementById('choice'), { page: 'midday', options: OPTIONS, layout: 'list', onDecided: showPlan });
    });
  </script>
</body>
</html>
